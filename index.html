<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>失落探險隊 Lost Explorers｜大佬群CSL製作</title>
<meta name="description" content="Coin Master 失落探險隊活動攻略：獎勵條、恐龍血量、全隊估算、下注順序與每週活動時間表。大佬群CSL製作。">
<meta name="theme-color" content="#0E2116">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F2A93B'/%3E%3Cpath d='M10 40Q14 32 24 32L32 30Q36 20 44 18L54 18Q58 19 58 24L58 28L50 29L51 32L46 33Q44 38 40 40L40 48L36 48L34 42L28 42L28 48L22 48L23 42Q16 42 10 40Z' fill='%230E2116'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canopy:#0E2116;
  --canopy-2:#122a1d;
  --fern:#1B412D;
  --fern-line:#2E5E43;
  --parchment:#F0E2BE;
  --parchment-2:#E4D19F;
  --ink:#2B1C0D;
  --ink-soft:#5A4529;
  --bone:#F5ECD4;
  --bone-dim:#C8C0A2;
  --amber:#F2A93B;
  --amber-deep:#B8670F;
  --lava:#D9472B;
  --moss:#93C552;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:8px;
  --font-display:"Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --font-body:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{margin:0;background:var(--canopy);color:var(--bone);font-family:var(--font-body);font-size:1rem;line-height:1.6;overflow-x:hidden}
html[lang="th"] body{line-height:1.75}
img,svg{display:block;max-width:100%}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(14,33,22,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(242,169,59,.18)}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bone);font-family:var(--font-display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand svg{width:34px;height:34px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:var(--bone-dim);text-decoration:none;font-weight:700;font-size:.92rem;padding:10px 12px;border-radius:999px;white-space:nowrap;transition:color .2s,background .2s}
.nav a:hover{color:var(--bone);background:rgba(255,255,255,.06)}
.lang{position:relative;display:flex;align-items:center}
.lang svg{position:absolute;left:11px;width:18px;height:18px;pointer-events:none;color:var(--amber)}
.lang select{appearance:none;-webkit-appearance:none;background:var(--fern);color:var(--bone);border:1px solid var(--fern-line);border-radius:999px;font:700 .92rem/1 var(--font-body);padding:12px 34px 12px 36px;min-height:44px;cursor:pointer}
.lang::after{content:"";position:absolute;right:14px;width:8px;height:8px;border-right:2px solid var(--bone-dim);border-bottom:2px solid var(--bone-dim);transform:translateY(-2px) rotate(45deg);pointer-events:none}
.lang select:hover{border-color:var(--amber)}
@media (max-width:860px){
  .topbar .wrap{flex-wrap:wrap;gap:0 12px;padding-top:8px}
  .lang{margin-left:auto}
  .nav{order:3;width:100%;margin:4px 0 0;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 12px;font-size:.88rem;background:rgba(255,255,255,.04)}
}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;min-height:min(720px,92vh);display:flex;align-items:flex-end}
.hero-art{position:absolute;inset:0;z-index:-1}
.hero-art svg{width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(14,33,22,.92) 0%,rgba(14,33,22,.55) 48%,rgba(14,33,22,0) 75%),linear-gradient(0deg,var(--canopy) 0%,rgba(14,33,22,0) 35%)}
.hero-inner{padding:120px 0 72px;max-width:640px}
.title-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px}
.hero h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2.7rem,8.5vw,5.6rem);line-height:1.02;letter-spacing:-.01em;background:linear-gradient(180deg,#FFF3C9 0%,#F7C35A 52%,#E08A1C 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3f0b) drop-shadow(0 7px 0 #3d2006) drop-shadow(0 14px 22px rgba(0,0,0,.45))}
.hero .en-name{display:block;margin-top:10px;font-family:var(--font-display);font-weight:700;font-size:clamp(1rem,2.4vw,1.3rem);color:var(--moss)}
.seal{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px 8px 10px;background:var(--lava);color:#FFF4DE;font-family:var(--font-display);font-weight:800;font-size:1rem;line-height:1.2;border-radius:10px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,236,200,.55),inset 0 0 0 5px var(--lava),inset 0 0 0 6px rgba(255,236,200,.35),0 6px 16px rgba(0,0,0,.35);white-space:nowrap}
.seal svg{width:22px;height:22px}
.lead{margin:22px 0 0;font-size:clamp(1.02rem,2.2vw,1.18rem);color:var(--bone);max-width:34em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 0;padding:0;list-style:none}
.stats li{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;background:rgba(14,33,22,.72);border:1px solid rgba(242,169,59,.35);border-radius:999px}
.stats svg{width:38px;height:38px;flex:none}
.stats b{font-family:var(--font-display);font-size:1.45rem;line-height:1;color:var(--amber)}
.stats span{font-size:.9rem;color:var(--bone-dim);font-weight:700}
.smoke{animation:drift 9s ease-in-out infinite;transform-origin:center}
.smoke:nth-child(2){animation-delay:-3s}.smoke:nth-child(3){animation-delay:-6s}
@keyframes drift{0%{transform:translate(0,0) scale(1);opacity:.5}50%{transform:translate(-14px,-26px) scale(1.15);opacity:.25}100%{transform:translate(0,0) scale(1);opacity:.5}}
@media (max-width:700px){
  .hero{min-height:auto}
  .hero::after{background:linear-gradient(0deg,var(--canopy) 8%,rgba(14,33,22,.78) 55%,rgba(14,33,22,.35) 100%)}
  .hero-inner{padding:180px 0 48px}
}

/* ---------- sections ---------- */
section{padding:80px 0;scroll-margin-top:70px}
@media (max-width:860px){section{padding:56px 0;scroll-margin-top:110px}}
.sec-head{max-width:46em;margin-bottom:32px}
.sec-head h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.75rem,4.2vw,2.6rem);line-height:1.15;color:var(--bone)}
.sec-head p{margin:12px 0 0;color:var(--bone-dim);font-size:1.02rem}
.alt{background:var(--canopy-2);border-block:1px solid rgba(255,255,255,.04)}

/* how */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:22px 22px 24px;border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(242,169,59,.08),transparent 70%)}
.steps svg{width:56px;height:56px;margin-bottom:12px}
.steps h3{margin:0 0 6px;font-family:var(--font-display);font-size:1.25rem;font-weight:800}
.steps h3::before{counter-increment:s;content:counter(s) ". ";color:var(--amber)}
.steps p{margin:0;color:var(--bone-dim)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* ---------- prize trail (the hero moment) ---------- */
.trail-panel{background:var(--fern);border:1px solid var(--fern-line);border-radius:var(--radius-lg);padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.trail-ctrl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px 20px}
.trail-ctrl label{font-weight:800;color:var(--bone)}
.count{font-family:var(--font-display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--amber);min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--amber) var(--p,0%),rgba(255,255,255,.12) var(--p,0%))}
input[type=range]::-moz-range-track{height:10px;border-radius:999px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:10px;border-radius:999px;background:var(--amber)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:#FFE7A8;border:4px solid var(--amber-deep);box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#FFE7A8;border:4px solid var(--amber-deep)}
.trail-meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:6px;color:var(--bone-dim);font-weight:700;font-size:.95rem}
.trail-meta strong{color:var(--bone)}
.bar{position:relative;margin:34px 6px 8px;height:22px}
.bar-track{position:absolute;inset:0;display:grid;grid-template-columns:repeat(20,1fr);gap:3px;padding:3px;background:#0b1a11;border-radius:999px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.bar-track i{border-radius:3px;background:rgba(255,255,255,.08);transition:background .25s}
.bar-track i:first-child{border-radius:999px 3px 3px 999px}.bar-track i:last-child{border-radius:3px 999px 999px 3px}
.bar-track i.on{background:linear-gradient(180deg,#9EE07A,#3C9A3A)}
.bar-mark{position:absolute;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:#0b1a11;border:3px solid #55644f;display:grid;place-items:center;transition:border-color .25s,background .25s}
.bar-mark span{font:800 .72rem/1 var(--font-display);color:var(--bone-dim)}
.bar-mark.on{border-color:var(--amber);background:#FFE7A8}
.bar-mark.on span{color:var(--ink)}
.prizes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0 0;padding:0;list-style:none}
.prize{position:relative;display:flex;flex-direction:column;background:var(--parchment);color:var(--ink);border-radius:var(--radius-md);padding:14px 14px 16px;box-shadow:0 2px 0 var(--parchment-2),0 10px 18px rgba(0,0,0,.25);transition:transform .25s}
.prize-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl{display:inline-grid;place-items:center;width:36px;height:36px;font:800 1.1rem/1 var(--font-display);color:#FFE7A8;background:#6a3d14;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.cost{display:flex;align-items:center;gap:4px;font-weight:800;font-size:.9rem;text-align:right;line-height:1.2}
.cost svg{width:22px;height:22px;flex:none}
.cost small{display:block;font-weight:700;font-size:.78rem;color:var(--ink-soft)}
.prize-art{height:110px;margin:10px 0 6px;display:grid;place-items:center;transition:filter .3s,opacity .3s}
.prize-art svg{height:100%;width:auto}
.prize h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:1.12rem;line-height:1.25}
.prize p{margin:2px 0 0;font-weight:700;color:var(--ink-soft);font-size:.95rem}
.prize .state{position:absolute;top:58px;right:12px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#3b2a16;color:#FFE7A8}
.prize .state svg{width:16px;height:16px}
.prize.locked .prize-art{filter:grayscale(.85) brightness(.85);opacity:.6}
.prize.unlocked{box-shadow:0 2px 0 var(--parchment-2),0 0 0 3px var(--amber),0 12px 24px rgba(242,169,59,.25)}
.prize.unlocked .state{background:#2f8a35;color:#fff}
.prize.grand{background:linear-gradient(160deg,#FFF1C4,#F2C766);}
.prize.grand h3{color:#7a3a05}
@media (max-width:980px){.prizes{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){
  .trail-panel{padding:18px 14px}
  .trail-ctrl{grid-template-columns:1fr auto}
  .trail-ctrl input{grid-column:1/-1;grid-row:2}
  .prizes{grid-template-columns:1fr;gap:12px}
  .prize{display:grid;grid-template-columns:96px 1fr;grid-template-areas:"art top" "art txt";column-gap:12px;align-items:center}
  .prize-top{grid-area:top}
  .prize-art{grid-area:art;height:84px;margin:0}
  .prize-txt{grid-area:txt}
  .prize .state{top:auto;bottom:10px;right:10px;width:26px;height:26px}
  .bar-mark{width:24px;height:24px;border-width:2px}
  .bar-mark span{font-size:.62rem}
}

/* ---------- dinos ---------- */
.dinos{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin:0;padding:0;list-style:none}
.dino{display:grid;grid-template-columns:118px 1fr 92px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.dino-name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem;color:var(--bone)}
.dino-name svg{width:30px;height:22px;color:var(--moss);flex:none}
.dino-bar{height:12px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.dino-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#B8670F,var(--amber))}
.dino.hard .dino-bar i{background:linear-gradient(90deg,#8f2a17,var(--lava))}
.dino.hard .dino-name svg{color:var(--lava)}
.dino-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:.95rem}
.dino-val small{font-weight:700;color:var(--bone-dim);font-size:.75rem;margin-left:3px}
.dino-total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-top:22px;padding:18px 20px;border-radius:var(--radius-md);background:var(--fern);border:1px solid var(--fern-line)}
.dino-total b{font-family:var(--font-display);font-size:1.8rem;color:var(--amber);font-variant-numeric:tabular-nums}
@media (max-width:860px){.dinos{grid-template-columns:1fr}}
@media (max-width:420px){.dino{grid-template-columns:100px 1fr 82px;gap:8px}.dino-name{font-size:.88rem}}

/* ---------- plan ---------- */
.plan{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.plan-card{background:var(--fern);border:1px solid var(--fern-line);border-radius:var(--radius-lg);padding:24px}
.plan-card h3{margin:0 0 4px;font-size:1rem;color:var(--bone-dim);font-weight:700}
.big{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;color:var(--amber);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--bone-dim);margin-left:6px}
.rate{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px dashed rgba(255,255,255,.15);font-weight:800}
.rate svg{width:40px;height:46px;flex:none}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.stepper label{font-weight:800;margin-right:auto}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--fern-line);background:#0f2b1c;color:var(--bone);font:800 1.4rem/1 var(--font-display);cursor:pointer;transition:border-color .2s,background .2s}
.stepper button:hover{border-color:var(--amber)}
.stepper button:active{background:#1d4a31}
.stepper output{min-width:2.4ch;text-align:center;font:800 1.6rem/1 var(--font-display);color:var(--bone)}
.per{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.per div{background:#0f2b1c;border-radius:var(--radius-md);padding:14px}
.per span{display:block;color:var(--bone-dim);font-weight:700;font-size:.9rem}
.per b{display:block;margin-top:4px;font-family:var(--font-display);font-size:1.6rem;line-height:1.1;color:var(--bone);font-variant-numeric:tabular-nums}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
@media (max-width:400px){.per{grid-template-columns:1fr}}

/* ---------- bets ---------- */
.seqs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.seq{background:var(--parchment);color:var(--ink);border-radius:var(--radius-lg);padding:22px;box-shadow:0 2px 0 var(--parchment-2),0 14px 28px rgba(0,0,0,.25)}
.seq-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.seq-head svg{width:46px;height:54px;flex:none}
.seq h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:1.45rem;line-height:1.1}
.seq-head p{margin:2px 0 0;font-weight:800;color:#8a3c0c}
.seq ol{margin:0;padding:0;list-style:none}
.seq li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(43,28,13,.22)}
.mult{display:inline-grid;place-items:center;min-width:52px;height:34px;padding:0 8px;border-radius:8px;background:#2b1c0d;color:#FFE7A8;font:800 1rem/1 var(--font-display)}
.seq li span{font-weight:700}
.seq li b{font-variant-numeric:tabular-nums}
.warm{margin:10px 0 0;font-weight:700;color:var(--ink-soft);font-size:.92rem}
.loop{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;border-radius:var(--radius-md);background:#3a2410;color:#FFEFC9;font-weight:700}
.loop svg{width:26px;height:26px;flex:none;color:var(--amber);margin-top:2px}
.loop small{display:block;color:#E3C893;font-weight:600}
@media (max-width:860px){.seqs{grid-template-columns:1fr}}

/* ---------- schedule ---------- */
.tz{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px;border-radius:999px;background:var(--fern);border:1px solid var(--fern-line);font-weight:700;font-size:.9rem;color:var(--bone)}
.tz svg{width:16px;height:16px;color:var(--amber)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.day{background:var(--fern);border:1px solid var(--fern-line);border-radius:var(--radius-lg);padding:18px 18px 8px}
.day.today{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber),0 16px 30px rgba(242,169,59,.15)}
.day h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-family:var(--font-display);font-weight:800;font-size:1.25rem}
.day h3 em{font-style:normal;font-size:.75rem;font-family:var(--font-body);font-weight:800;padding:3px 10px;border-radius:999px;background:var(--amber);color:var(--ink)}
.ev{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.ev:first-of-type{border-top:0}
.ev time{font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.5}
.ev h4{margin:0;font-size:1.02rem;font-weight:800;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 5px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);font-size:.84rem;font-weight:700;color:var(--bone);line-height:1.35}
.tag svg{width:18px;height:18px;flex:none}
.tag.txt{padding-left:9px}
.note{display:flex;gap:8px;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(147,197,82,.12);color:#D7EDB8;font-size:.86rem;font-weight:700}
.note svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--moss)}
@media (max-width:400px){.days{grid-template-columns:1fr}.ev{grid-template-columns:50px 1fr;gap:10px}}

/* ---------- footer ---------- */
footer{padding:44px 0 56px;border-top:1px solid rgba(242,169,59,.18);background:#0a1910;text-align:center}
footer svg{width:64px;height:48px;margin:0 auto 10px;color:var(--fern-line)}
footer p{margin:4px 0;color:var(--bone-dim);font-size:.9rem}
footer .copy{font-family:var(--font-display);font-weight:800;color:var(--bone);font-size:1.05rem}
</style>

/* ---------------- helpers ---------------- */
var lang="zh-Hant", nf;
function T(k,v){var s=I18N[lang][k];if(s==null)s=I18N.en[k];if(s==null)return k;if(v)for(var p in v)s=s.split("{"+p+"}").join(v[p]);return s;}
function N(n){return nf.format(n);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function ico(id,vb){return '<svg viewBox="'+(vb||"0 0 24 24")+'" aria-hidden="true"><use href="#'+id+'"/></svg>';}

function pickLang(){
  var q=new URLSearchParams(location.search).get("lang");
  if(q&&I18N[q])return q;
  try{var s=localStorage.getItem("cm-lost-lang");if(s&&I18N[s])return s;}catch(e){}
  var navs=navigator.languages||[navigator.language||"zh-Hant"];
  for(var i=0;i<navs.length;i++){var l=(navs[i]||"").toLowerCase();
    if(l.indexOf("zh")===0)return "zh-Hant";
    var b=l.split("-")[0];if(I18N[b])return b;}
  return "zh-Hant";
}

/* ---------------- renderers ---------------- */
function renderStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=T(el.getAttribute("data-i18n"));});
  document.title=T("title")+(lang==="en"?"":" · Lost Explorers")+"｜大佬群CSL製作";
}

function prizeDetail(p){
  var d=p.detail;
  if(d.range)return d.range[0]+"–"+d.range[1]+" "+T("spins");
  if(d.times)return "×"+d.times;
  if(d.spins)return d.spins+" "+T("spins");
  if(d.tokens)return d.tokens+" "+T("tokens");
  if(d.key)return T(d.key);
  return "";
}

function renderPrizes(){
  var cum=0,html="",marks="";
  PRIZES.forEach(function(p,i){
    cum+=p.cost;p.cum=cum;
    html+='<li class="prize'+(p.grand?" grand":"")+'" data-i="'+i+'">'+
      '<div class="prize-top"><span class="lvl" aria-label="'+esc(T("level",{n:i+1}))+'">'+(i+1)+'</span>'+
      '<span class="cost">'+ico("i-flag","0 0 60 60")+'<span>'+esc(T("flagCost",{c:p.cost}))+'<small>'+esc(T("cum",{t:cum}))+'</small></span></span></div>'+
      '<div class="prize-art">'+ico(p.icon,p.vb)+'</div>'+
      '<div class="prize-txt"><h3>'+esc(T(p.name))+'</h3><p>'+esc(prizeDetail(p))+'</p></div>'+
      '<span class="state"></span></li>';
    marks+='<span class="bar-mark" data-c="'+cum+'" style="left:'+(cum/20*100)+'%"><span>'+(i+1)+'</span></span>';
  });
  $("prizeList").innerHTML=html;
  $("barMarks").innerHTML=marks;
  var segs="";for(var s=0;s<20;s++)segs+="<i></i>";
  $("barTrack").innerHTML=segs;
  updateTrail();
}

function updateTrail(){
  var k=+$("kills").value;
  $("killsOut").textContent=k;
  $("kills").style.setProperty("--p",(k/20*100)+"%");
  var hp=0;for(var i=0;i<k;i++)hp+=DINO_HP[i];
  var u=0;
  document.querySelectorAll("#prizeList .prize").forEach(function(li){
    var p=PRIZES[+li.getAttribute("data-i")],on=k>=p.cum;if(on)u++;
    li.classList.toggle("unlocked",on);li.classList.toggle("locked",!on);
    var st=li.querySelector(".state");st.innerHTML=ico(on?"i-check":"i-lock");st.setAttribute("title",T(on?"unlockedA":"lockedA"));
    st.setAttribute("aria-label",T(on?"unlockedA":"lockedA"));st.setAttribute("role","img");
  });
  document.querySelectorAll("#barTrack i").forEach(function(seg,i){seg.classList.toggle("on",i<k);});
  document.querySelectorAll("#barMarks .bar-mark").forEach(function(m){m.classList.toggle("on",k>=+m.getAttribute("data-c"));});
  $("flagsTxt").innerHTML="<strong>"+esc(T("flags",{f:k}))+"</strong>";
  $("hpTxt").textContent=T("hpSoFar",{hp:N(hp)});
  $("unlockTxt").textContent=T("unlocked",{u:u});
}

function renderDinos(){
  var max=Math.max.apply(null,DINO_HP),total=0,html="";
  DINO_HP.forEach(function(hp,i){
    total+=hp;
    html+='<li class="dino'+(hp>=150000?" hard":"")+'"><span class="dino-name">'+ico("i-dino","0 0 64 48")+esc(T("dino",{n:i+1}))+'</span>'+
      '<span class="dino-bar" aria-hidden="true"><i style="width:'+Math.max(2,hp/max*100).toFixed(1)+'%"></i></span>'+
      '<span class="dino-val">'+N(hp)+'<small>'+esc(T("pts"))+'</small></span></li>';
  });
  $("dinoList").innerHTML=html;
  $("dinoTotal").textContent=N(total)+" "+T("pts");
}

var team=4, TOTAL=DINO_HP.reduce(function(a,b){return a+b;},0);
function renderPlan(){
  $("bigTotal").innerHTML=N(TOTAL)+"<small>"+esc(T("pts"))+"</small>";
  $("rateTxt").textContent=T("rate",{a:N(1000),b:N(30000),c:N(40000)});
  $("teamOut").textContent=team;
  var per=TOTAL/team;
  $("perPts").textContent=N(Math.round(per));
  var lo=Math.round(per/40000*1000/100)*100, hi=Math.round(per/30000*1000/100)*100;
  $("perElx").textContent=N(lo)+"–"+N(hi);
  $("teamMinus").disabled=team<=1;$("teamPlus").disabled=team>=20;
}

function renderSeqs(){
  var html="";
  SEQS.forEach(function(s,i){
    var warm=0,rows="";
    s.rows.forEach(function(r){var e=r[0]*10*r[1];warm+=e;
      rows+='<li><span class="mult">×'+r[0]+'</span><span>'+esc(T("row",{b:r[0],x:r[1]}))+'</span><b>'+esc(T("elx",{e:N(e)}))+'</b></li>';});
    html+='<article class="seq"><div class="seq-head">'+ico("i-elixir","0 0 60 70")+'<div><h3>'+esc(T("seq",{n:i+1}))+'</h3><p>'+esc(T("minElx",{n:N(s.min)}))+'</p></div></div>'+
      '<ol>'+rows+'</ol><p class="warm">'+esc(T("warm",{e:N(warm)}))+'</p>'+
      '<div class="loop">'+ico("i-loop")+'<div>'+esc(T("loop",{b:s.loop,p:N(s.prize)}))+'<small>'+esc(T("perSpin",{e:N(s.loop*10)}))+'</small></div></div></article>';
  });
  $("seqs").innerHTML=html;
}

function tagHTML(t){
  var k=t[0],v=t[1];
  function tg(icon,text){return '<span class="tag">'+ico(icon)+esc(text)+'</span>';}
  function tx(text){return '<span class="tag txt">'+esc(text)+'</span>';}
  switch(k){
    case "attack":return tg("i-hammer",T("attack")+" "+v);
    case "raid":return tg("i-shovel",T("raid")+" "+v);
    case "spins":return tg("i-bolt",v);
    case "spinsTotal":return tg("i-bolt",T("totalN",{n:v}));
    case "elixir":return tg("i-elx-sm",v+" "+T("elixir"));
    case "elixirOnly":return tg("i-elx-sm",T("elixir"));
    case "goldHammer":return tg("i-goldhammer",T("goldHammer"));
    case "track":return tg("i-elx-sm",T("potionTrack")+" "+v);
    case "days":return tx(T("daysN",{n:v}));
    case "missions":return tx(T("missions",{n:v}));
    case "stages":return tx(T("stages",{n:v}));
    case "txt":return tx(T(v));
  }
  return "";
}

function taipeiDayIndex(){
  try{var w=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",weekday:"short"}).format(new Date());
    return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(w);}catch(e){return -1;}
}

function renderSchedule(){
  var today=taipeiDayIndex(),days=I18N[lang].days,evs=I18N[lang].ev,html="";
  SCHEDULE.forEach(function(g){
    var isToday=g.d===today;
    var name=g.d<7?days[g.d]:T("nextMon");
    html+='<article class="day'+(isToday?" today":"")+'"><h3>'+esc(name)+(isToday?'<em>'+esc(T("today"))+'</em>':"")+'</h3>';
    g.items.forEach(function(it){
      html+='<div class="ev"><time>'+it.time+'</time><div><h4>'+esc(evs[it.ev])+'</h4><div class="tags">'+it.tags.map(tagHTML).join("")+'</div>'+
        (it.note?'<div class="note">'+ico("i-info")+'<span>'+esc(T(it.note))+'</span></div>':"")+'</div></div>';
    });
    html+='</article>';
  });
  $("days").innerHTML=html;
}

function renderAll(){
  nf=new Intl.NumberFormat(lang==="zh-Hant"?"zh-TW":lang);
  renderStatic();renderPrizes();renderDinos();renderPlan();renderSeqs();renderSchedule();
}

/* ---------------- init ---------------- */
lang=pickLang();
$("langSel").value=lang;
$("year").textContent=new Date().getFullYear();
renderAll();

$("langSel").addEventListener("change",function(){
  lang=this.value;
  try{localStorage.setItem("cm-lost-lang",lang);}catch(e){}
  var u=new URL(location.href);u.searchParams.set("lang",lang);history.replaceState(null,"",u);
  renderAll();
});
$("kills").addEventListener("input",updateTrail);
$("teamMinus").addEventListener("click",function(){if(team>1){team--;renderPlan();}});
$("teamPlus").addEventListener("click",function(){if(team<20){team++;renderPlan();}});
})();
</script>
